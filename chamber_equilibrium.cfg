# Include this file from printer.cfg after installing chamber_equilibrium.py.
[chamber_equilibrium]
# Configured Klipper object for the chamber-air sensor.
sensor: temperature_sensor chamber
# Probe interval in seconds.
interval: 60
# Chamber must be at least target minus this value, in C.
target_tolerance: 3
# Maximum temperature change over the stability window, in C.
stability_tolerance: 3
# Stability window in seconds. Preserves the previous five-minute comparison.
stability_window: 300
# Fail-closed total timeout in seconds.
max_wait: 1800
# Warm-up trend check settings. Tune minimum rate for the installed hardware.
heating_rate_window: 300
heating_rate_grace: 300
# 0 detects flat or falling temperature. Set a higher verified rate to detect slow heating.
min_heating_rate: 0
