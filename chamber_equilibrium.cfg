# Include this file from printer.cfg after installing chamber_equilibrium.py.
[chamber_equilibrium]
# Sensor object name from Klipper's printer object list.
sensor: temperature_sensor chamber
# First temperature sample delay, in seconds.
initial_delay: 480
# Time between later samples, in seconds.
interval: 300
# Required minimum temperature is TARGET minus this value, in C.
target_tolerance: 3
# Maximum absolute change between adjacent samples, in C.
stability_tolerance: 3
# Fail-closed timeout, in seconds.
max_wait: 5400
