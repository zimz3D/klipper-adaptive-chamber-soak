# SAFE INSTALLATION PATCH for RatOS _CHAMBER_HEATER_ON.
# This is an edit to the existing macro, not a second duplicate macro section.
# The supplied RatOS setting requests 150 C, but the supplied Klipper heater
# max_temp is 80 C. Ignore the 150 C request and set this RatOS variable to 80
# so the requested preheat does not exceed the existing Klipper limit.
# Do not raise max_temp to accommodate the old command.
# Replace only the original TEMPERATURE_WAIT line with the command below.
# Preserve the rest of RatOS _CHAMBER_HEATER_ON and all ON/OFF/control macros.

# Existing line to replace:
# TEMPERATURE_WAIT SENSOR="{chamber_temp_sensor}" MINIMUM={(start_chamber_temp if start_chamber_temp > 0 else chamber_temp)}

# In the [gcode_macro RatOS] override, set:
# variable_chamber_heater_preheating_temp: 80
# Keep the heater's existing max_temp at 80 C.

# Replacement line:
# WAIT_CHAMBER_EQUILIBRIUM SENSOR="{chamber_temp_sensor}" TARGET={(start_chamber_temp if start_chamber_temp > 0 else chamber_temp)} INITIAL_DELAY=480 INTERVAL=300 TARGET_TOLERANCE=3 STABILITY_TOLERANCE=3 MAX_WAIT=5400

# Keep the following RatOS code immediately after the wait unchanged:
# {% if printer["heater_generic chamber_heater"] is defined %}
#     SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={(chamber_temp + chamber_heater_heating_temp_offset)}
# {% endif %}

# Required in the existing [gcode_macro RatOS] section of printer.cfg.
# Without it RatOS uses its default 20-minute soak instead of this adaptive path.
# variable_beacon_adaptive_heat_soak: False
